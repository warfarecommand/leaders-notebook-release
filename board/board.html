<style>/* WC Design v1 */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F6; --fill:rgba(28,28,30,.055); --fill-2:rgba(28,28,30,.09);
  --sep:rgba(28,28,30,.09); --ink:#1C1C1E; --ink-2:#48484D; --ink-3:#5F5F65;
  --accent:#C8102E; --accent-ink:#A30D25; --accent-fill:rgba(200,16,46,.09); --on-accent:#FFFFFF;
  --amber-ink:#9A4000; --amber-fill:rgba(184,78,0,.10); --green-ink:#166A49; --green-fill:rgba(26,125,85,.10); --blue-ink:#3B5C9A; --blue-fill:rgba(59,92,154,.10);
  --r-card:16px; --r-group:14px; --r-control:12px; --r-pill:999px; --r-sheet:24px; --r-stamp:10px;
  --shadow-card:0 1px 2px rgba(20,20,22,.04),0 6px 20px rgba(20,20,22,.06);
  --shadow-raised:0 2px 6px rgba(20,20,22,.06),0 14px 36px rgba(20,20,22,.10);
  --shadow-sheet:0 -10px 44px rgba(0,0,0,.18);
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:120ms; --t:220ms;
}
/* dark: --bg:#0B0B0C; --surface:#161618; --surface-2:#1E1E21; --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11);
   --sep:rgba(255,255,255,.08); --ink:rgba(255,255,255,.94); --ink-2:rgba(255,255,255,.70); --ink-3:rgba(255,255,255,.58);
   --accent-ink:#FF5468; --accent-fill:rgba(255,84,104,.14); shadows off, cards get a 1px rgba(255,255,255,.06) inner border instead */
:root{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0C; --surface:#161618; --surface-2:#1E1E21; --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.11);
--sep:rgba(255,255,255,.08); --ink:rgba(255,255,255,.94); --ink-2:rgba(255,255,255,.70); --ink-3:rgba(255,255,255,.58);
--accent-ink:#FF6375; --accent-fill:rgba(255,84,104,.14); --shadow-card:none; --shadow-raised:none; --shadow-sheet:none; color-scheme:dark;}}

/* Shipped WC Design v1 aliases. */
:root,[data-theme]{--panel:var(--surface);--panel-2:var(--surface-2);--line:var(--sep);--line-2:var(--sep);--red:var(--accent);--red-ink:var(--accent-ink);--red-tint:var(--accent-fill);--focus:var(--accent);--scrim:rgba(0,0,0,.32);--radius-card:var(--r-card);--radius-control:var(--r-control);--radius-sheet:var(--r-sheet)}
[data-theme=dark]{--shadow-sheet:0 -10px 44px rgba(0,0,0,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--shadow-sheet:0 -10px 44px rgba(0,0,0,.18)}}

/* Shipped dark status inks. */
[data-theme=dark]{--amber-ink:#FFB37A;--green-ink:#80D7AE;--blue-ink:#A4C0F5}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--amber-ink:#FFB37A;--green-ink:#80D7AE;--blue-ink:#A4C0F5}}

/* WC Design v1 component kit. */
